name: Wasm

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || github.actor_id }}
  cancel-in-progress: true

jobs:
  js_lint:
    name: "JS / Lint"
    runs-on: ubuntu-latest
    env:
      GOOS: js
      GOARCH: wasm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y -q libgtk-3-dev libayatana-appindicator3-dev libgl1-mesa-dev xorg-dev libpcap-dev
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: latest
          install-mode: binary
          skip-cache: true
          skip-save-cache: true
          cache-invalidation-interval: 0
          working-directory: ./client
        continue-on-error: true

  js_build:
    name: "JS / Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - name: Build Wasm client
        run: GOOS=js GOARCH=wasm go build -o netbird.wasm ./client/wasm/cmd
        env:
          CGO_ENABLED: 0
      - name: Check Wasm build size
        run: |
          echo "Wasm build size:"
          ls -lh netbird.wasm

          SIZE=$(stat -c%s netbird.wasm)
          SIZE_MB=$((SIZE / 1024 / 1024))

          echo "Size: ${SIZE} bytes (${SIZE_MB} MB)"

          # Limit 57 MiB (59768832 bytes), raised from upstream's 56 MiB (58720256) on the fork.
          # Measured in CI: 58551494 bytes before the goat changes (f431fc610), 58743424 with
          # ADR 1273 phases 1 to 3 before the js stubs. Measured locally (CI reads about
          # 2.5 KB more): 58697512 on main at 545b434f7, 58706611 with phases 3 to 5 (#5 to #9).
          # The extra MiB is for upstream growth between syncs; move it with an upstream sync,
          # with the new measurements recorded here.
          if [ ${SIZE} -gt 59768832 ]; then
            echo "Wasm binary size (${SIZE_MB}MB) exceeds 57MB limit!"
            exit 1
          fi

